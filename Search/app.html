<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Endroid Search</title>
  <meta name="description" content="Endroid Search — clean Material You search shell with dark mode and UUID helper." />
  <meta name="theme-color" content="#fef7ff" />
  <link rel="canonical" href="https://endroid.pages.dev/Search/" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/shared/endroid.css" rel="stylesheet" />
  <script src="/shared/endroid.js" defer></script>
  <script src="https://unpkg.com/lucide@0.469.0" defer></script>
  <style>
    .wrap {
      min-height: calc(100dvh - 56px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem max(1rem, env(safe-area-inset-left)) 2rem max(1rem, env(safe-area-inset-right));
      gap: 1.25rem;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: grid; place-items: center;
      box-shadow: var(--md-elevation-2);
    }
    .logo svg, .logo i { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
    form.search {
      width: min(560px, 100%);
      display: flex; align-items: center; gap: .5rem;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: var(--md-radius-full);
      padding: .35rem .35rem .35rem 1rem;
      box-shadow: var(--md-elevation-2);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    form.search:focus-within {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-sys-color-primary) 25%, transparent);
    }
    form.search input {
      flex: 1; border: none; background: transparent; outline: none;
      font: 500 1rem var(--md-font); color: var(--md-sys-color-on-surface);
      min-width: 0; padding: .65rem 0;
    }
    form.search button[type=submit] {
      width: 48px; height: 48px; border: none; border-radius: 999px;
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
      display: grid; place-items: center; cursor: pointer;
    }
    .util {
      width: min(560px, 100%);
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-radius-md);
      padding: 1rem;
    }
    .util h2 { margin: 0 0 .5rem; font-size: 1rem; }
    .util-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .util code {
      flex: 1; min-width: 12rem;
      font-size: .85rem; word-break: break-all;
      background: var(--md-sys-color-surface-container-highest);
      padding: .55rem .7rem; border-radius: 10px;
    }
    .hint { color: var(--md-sys-color-on-surface-variant); font-size: .85rem; margin: 0; }
  </style>
</head>
<body class="e-shell">
  <header class="e-topbar">
    <a class="e-brand" href="/"><i data-lucide="hexagon"></i> Endroid <span>Dash</span></a>
    <div class="e-actions">
      <button type="button" class="e-icon-btn" aria-label="Toggle theme" onclick="endroidToggleTheme()">
        <i data-lucide="moon" data-theme-icon></i>
      </button>
      <a class="e-icon-btn" href="/" aria-label="Home"><i data-lucide="home"></i></a>
    </div>
  </header>

  <div class="wrap">
    <div class="logo" aria-hidden="true"><i data-lucide="search"></i></div>
    <h1>Endroid Search</h1>
    <p class="hint">Type a query and go — or grab a UUID from the edge API.</p>
    <form class="search" action="https://www.google.com/search" method="get" role="search">
      <input name="q" type="search" placeholder="Search the web" required autocomplete="off" autofocus />
      <button type="submit" aria-label="Search"><i data-lucide="arrow-right"></i></button>
    </form>
    <div class="util">
      <h2>UUID</h2>
      <div class="util-row">
        <code id="uuid-out">—</code>
        <button type="button" class="e-btn e-btn-tonal" id="uuid-btn">Generate</button>
        <button type="button" class="e-btn e-btn-outline" id="uuid-copy">Copy</button>
      </div>
      <p class="hint" style="margin-top:.65rem">Powered by <code>/api/uuid</code> on Cloudflare Pages.</p>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.lucide) lucide.createIcons();
      var out = document.getElementById("uuid-out");
      var btn = document.getElementById("uuid-btn");
      var copy = document.getElementById("uuid-copy");
      async function gen() {
        out.textContent = "…";
        try {
          var r = await fetch("/api/uuid");
          var j = await r.json();
          out.textContent = j.uuid || "error";
        } catch (e) {
          out.textContent = crypto.randomUUID ? crypto.randomUUID() : "offline";
        }
      }
      btn.addEventListener("click", gen);
      copy.addEventListener("click", function () {
        if (out.textContent && out.textContent !== "—") navigator.clipboard.writeText(out.textContent);
      });
      gen();
    });
  </script>
</body>
</html>
